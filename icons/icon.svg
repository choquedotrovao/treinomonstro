<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Glow -->
  <ellipse cx="256" cy="256" rx="230" ry="230" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.25"/>
  <!-- M letter -->
  <text x="256" y="342"
        font-family="Arial Black, Impact, sans-serif"
        font-size="250"
        font-weight="900"
